<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CartTruth Kiosk</title>
<style>
  :root { --bg:#0b0f17; --panel:#141b29; --line:#222c40; --text:#e6ebf5; --mute:#8794ad;
          --ok:#2ecc8f; --bad:#ff4d5e; --accent:#5b8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--text); min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center;
           padding:18px 28px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  header h1 span { color:var(--accent); }
  .tag { color:var(--mute); font-size:13px; }
  main { display:grid; grid-template-columns: 1.4fr 1fr; gap:20px; padding:24px 28px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .panel h2 { margin:0 0 14px; font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--mute); }
  .right { display:flex; flex-direction:column; gap:20px; }
  .row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:18px; }
  .row:last-child { border-bottom:none; }
  .empty { color:var(--mute); padding:24px 0; text-align:center; }
  .total { display:flex; justify-content:space-between; margin-top:16px; padding-top:16px;
           border-top:2px solid var(--line); font-size:24px; font-weight:700; }
  .cam { height:150px; border-radius:10px; background:#05080e; border:1px dashed var(--line);
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--ok); animation:pulse 1.4s infinite; display:inline-block; margin-right:8px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .expect { margin-top:12px; font-size:15px; color:var(--mute); }
  .expect b { color:var(--text); }
  .alert { padding:10px 12px; border-left:4px solid var(--bad); background:#2a1620; border-radius:6px; margin-bottom:8px; font-size:14px; }
  .alert.resolved { border-color:var(--ok); background:#112a22; opacity:.7; }
  button { background:var(--accent); color:#fff; border:0; padding:10px 18px; border-radius:8px; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--mute); }

  body.alarm { animation:flash 0.9s infinite; }
  @keyframes flash { 0%,100%{ box-shadow: inset 0 0 0 0 rgba(255,77,94,0); background:var(--bg);}
                     50%{ box-shadow: inset 0 0 120px 30px rgba(255,77,94,.55); background:#240c12; } }

  #modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:10; }
  #modal.show { display:flex; }
  .card { background:#1c0f15; border:2px solid var(--bad); border-radius:18px; padding:36px 44px; max-width:560px; text-align:center; }
  .card .lvl { color:var(--bad); font-weight:700; letter-spacing:2px; font-size:14px; }
  .card h3 { font-size:30px; margin:12px 0; }
  .card p { color:#f3c6cc; font-size:18px; margin:8px 0 22px; }
</style>
</head>
<body>
<header>
  <h1>Cart<span>Truth</span> &middot; Self-Checkout</h1>
  <div><span class="tag">Scan each item you take. </span><button class="ghost" onclick="resetCart()">Reset</button></div>
</header>

<main>
  <section class="panel">
    <h2>Current Cart</h2>
    <div id="cart"><div class="empty">Cart is empty. Pick an item and scan it with your phone.</div></div>
    <div class="total"><span>Total</span><span id="total">&#8377;0.00</span></div>
  </section>

  <div class="right">
    <section class="panel">
      <h2>Live CCTV Feed</h2>
      <div class="cam"><div><span class="dot"></span><b>Camera Active</b></div>
        <div class="tag" id="camline">Watching shelf&hellip;</div></div>
      <div class="expect" id="expect">Expected scan: <b>none</b></div>
    </section>
    <section class="panel">
      <h2>Alerts</h2>
      <div id="alerts"><div class="empty">No alerts</div></div>
    </section>
  </div>
</main>

<div id="modal">
  <div class="card">
    <div class="lvl">LEVEL 1 NUDGE</div>
    <h3>Item mismatch</h3>
    <p id="modalmsg"></p>
    <p><b>Please scan the correct item.</b></p>
    <button onclick="dismiss()">OK, I'll rescan</button>
  </div>
</div>

<script>
let dismissedId = 0;
let latestAlertId = 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupee = n => '\u20B9' + Number(n).toFixed(2);

function dismiss() { dismissedId = latestAlertId; document.getElementById('modal').classList.remove('show'); }
async function resetCart() { await fetch('/api/reset', {method:'POST'}); dismissedId = 0; refresh(); }

function render(s) {
    const cart = document.getElementById('cart');
  const groups = {};
  s.cart.forEach(i => {
    if (!groups[i.fruit]) groups[i.fruit] = { name: i.name, price: i.price, qty: 0 };
    groups[i.fruit].qty += 1;
  });
  const rows = Object.values(groups);
  cart.innerHTML = rows.length
    ? rows.map(g => `<div class="row">
        <span>${esc(g.name)} &times; ${g.qty} <small style="color:var(--mute)">(${rupee(g.price)} each)</small></span>
        <span>${rupee(g.price * g.qty)}</span></div>`).join('')
    : '<div class="empty">Cart is empty. Pick an item and scan it with your phone.</div>';
  document.getElementById('total').textContent = rupee(s.total);

  const ev = s.last_vision_event;
  document.getElementById('expect').innerHTML = 'Expected scan: <b>' + (ev ? esc(ev.fruit) : 'none') + '</b>';
  document.getElementById('camline').textContent = ev
    ? `CCTV saw ${ev.type} \u2192 ${ev.fruit} (${Math.max(0, Math.round(s.server_time - ev.ts))}s ago)`
    : 'Watching shelf\u2026';

  const al = document.getElementById('alerts');
  al.innerHTML = s.alerts.length
    ? s.alerts.slice().reverse().map(a => `<div class="alert ${a.resolved ? 'resolved' : ''}">${esc(a.message)}</div>`).join('')
    : '<div class="empty">No alerts</div>';

  const active = s.active_alert;
  document.body.classList.toggle('alarm', !!active);
  if (active) {
    latestAlertId = active.id;
    document.getElementById('modalmsg').textContent = active.message;
    if (active.id > dismissedId) document.getElementById('modal').classList.add('show');
  } else {
    document.getElementById('modal').classList.remove('show');
  }
}

async function refresh() {
  try { render(await (await fetch('/api/state')).json()); } catch (e) { /* server down: keep last view */ }
}
setInterval(refresh, 1000);
refresh();
</script>
</body>
</html>
